<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILO - Personal Assistant</title>
    
    <!-- KODE LOGO/IKON APLIKASI -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 12px 20px;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        h1 { margin: 0; font-size: 1.1rem; color: var(--accent-color); }
        
        .settings-btn {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
        }

        #config-section {
            padding: 10px 15px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 8px;
        }
        input[type="password"] {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 0.9rem;
        }
        
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 0.95rem;
        }
        .user-msg {
            align-self: flex-end;
            background-color: #0284c7;
        }
        .milo-msg {
            align-self: flex-start;
            background-color: var(--card-bg);
            border: 1px solid #334155;
        }
        
        #input-container {
            padding: 12px 15px;
            background-color: var(--card-bg);
            display: flex;
            gap: 8px;
            border-top: 1px solid #334155;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 0.95rem;
        }
        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button.mic-btn {
            background-color: #e11d48;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 MILO</h1>
        <button class="settings-btn" onclick="toggleSettings()" title="Pengaturan API Key">⚙️</button>
    </header>

    <div id="config-section" style="display: none;">
        <input type="password" id="api-key" placeholder="Masukkan Gemini API Key...">
        <button onclick="saveKey()">Simpan</button>
    </div>

    <div id="chat-box">
        <div class="msg milo-msg">Halo! Aku MILO. Ada ide spontan atau tugas apa yang mau kita eksekusi sekarang?</div>
    </div>

    <div id="input-container">
        <button class="mic-btn" onclick="startVoice()">🎙️</button>
        <input type="text" id="user-input" placeholder="Ketik atau gunakan suara...">
        <button onclick="sendMessage()">Kirim</button>
    </div>

    <script>
        const savedKey = localStorage.getItem('GEMINI_KEY');
        const configSection = document.getElementById('config-section');
        
        if (savedKey) {
            document.getElementById('api-key').value = savedKey;
            configSection.style.display = 'none'; // Sembunyikan otomatis jika sudah ada key
        } else {
            configSection.style.display = 'flex'; // Tampilkan jika belum ada key
        }

        function toggleSettings() {
            if (configSection.style.display === 'none') {
                configSection.style.display = 'flex';
            } else {
                configSection.style.display = 'none';
            }
        }

        function saveKey() {
            const key = document.getElementById('api-key').value.trim();
            if (key) {
                localStorage.setItem('GEMINI_KEY', key);
                alert('API Key tersimpan!');
                configSection.style.display = 'none'; // Langsung sembunyikan setelah disimpan
            } else {
                alert('Masukkan API Key yang valid.');
            }
        }

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Browser kamu belum mendukung perintah suara.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.start();

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                document.getElementById('user-input').value = text;
                sendMessage();
            };
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const userText = inputField.value.trim();
            const apiKey = localStorage.getItem('GEMINI_KEY');

            if (!userText) return;
            if (!apiKey) {
                alert("Masukkan Gemini API Key lewat ikon roda gigi (⚙️) di atas ya!");
                configSection.style.display = 'flex';
                return;
            }

            appendMessage(userText, 'user-msg');
            inputField.value = '';

            const loadingDiv = appendMessage("MILO sedang berpikir...", 'milo-msg');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Kamu adalah MILO (Mind & Idea Launch Operator), asisten pribadi eksekutor cepat ala JARVIS. Jawablah dengan singkat, langsung ke poin, dan berikan langkah konkret pertama. Pertanyaan user: ${userText}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;

                loadingDiv.innerText = reply;
                speak(reply);

            } catch (error) {
                loadingDiv.innerText = "Maaf, terjadi kesalahan pada API Key atau jaringan.";
            }
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
